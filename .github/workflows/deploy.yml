name: Deploy Pages

# algo-viz 独立成仓库后此 workflow 自动生效；
# 若保留在嵌套大仓库，需将本文件移至仓库根 .github/workflows 并加 paths 过滤与 working-directory（见 docs/deployment.md）。
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 官方 Pages 模板取 cancel-in-progress: false：
# 连续 push 时取消进行中的部署会让站点停留旧版，宁可排队
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          # 仓库变量 BUN_VERSION 可选固定版本，未设默认 latest
          bun-version: ${{ vars.BUN_VERSION || 'latest' }}
      - run: bun install --frozen-lockfile
      # 质量门禁：lint 0 警告基线 + 单元测试，先于类型检查与构建
      - run: bun run lint
      - run: bun test
      - run: bun run build
        env:
          # 项目页子路径；若仓库名为 <user>.github.io 或绑自定义域名，改为 BASE_PATH: /
          BASE_PATH: /${{ github.event.repository.name }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
